version: "3.8"

services:
  mongo:
    image: mongo:7
    container_name: mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db

  backend:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: ai_backend
    ports:
      - "${PORT:-5000}:5000"
    env_file:
      - ./server/.env.development
    depends_on:
      - mongo
    restart: unless-stopped

  frontend:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: ai_frontend
    ports:
      - "3000:5173"
    env_file:
      - ./client/.env.development
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  mongo-data:
